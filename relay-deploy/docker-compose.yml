# Zentic relay behind Caddy (automatic HTTPS) on a single host.
# The relay image is built on this host from the repository source.
# Settings come from .env (copy .env.example). See README.md.

services:
  relay:
    build:
      # The repository root, the parent of this directory, holds the Dockerfile.
      context: ..
    image: zentic-relay:local
    restart: unless-stopped
    # No published ports: only Caddy reaches the relay, over the compose network.
    expose:
      - "4000"
    environment:
      ZENTIC_RELAY_HOST: 0.0.0.0
      ZENTIC_RELAY_PORT: "4000"
      # Pause admission and shed WebSockets before the container hits its memory limit.
      ZENTIC_RELAY_MEMORY_WATERMARK_BYTES: ${RELAY_MEMORY_WATERMARK_BYTES:-1610612736}
    mem_limit: ${RELAY_MEM_LIMIT:-2g}
    # The image has no curl or wget, so probe /health (liveness) with bash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/4000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account. Keep this volume, or Caddy re-issues on every start.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
